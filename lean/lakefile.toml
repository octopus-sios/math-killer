name = "math_killer"
version = "0.1.0"
defaultTargets = ["Warmup", "Conjectures", "ProofAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Warmup"

[[lean_lib]]
name = "Conjectures"
moreLeanArgs = ["-j1", "-M4500"]

[[lean_lib]]
name = "ProofAudit"
